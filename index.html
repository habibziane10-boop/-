<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خدمات سيف الدين للعمل</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* الشريط العلوي */
header{
  background:#ffffff;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:bold;
  color:#0756a8;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#0756a8;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.top-buttons{
  display:flex;
  gap:8px;
}

.top-btn{
  border:0;
  padding:10px 15px;
  border-radius:10px;
  background:#0756a8;
  color:#fff;
  font-weight:bold;
}

.top-btn.red{
  background:#c62828;
}

/* التخطيط */
.layout{
  display:flex;
  min-height:calc(100vh - 70px);
}

/* القائمة الجانبية */
.sidebar{
  width:245px;
  background:#ffffff;
  border-left:1px solid #e6eaf0;
  padding:20px 15px;
}

.menu-title{
  color:#777;
  font-size:13px;
  margin:5px 10px 12px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.menu button{
  width:100%;
  border:0;
  background:transparent;
  padding:13px 15px;
  border-radius:10px;
  text-align:right;
  font-size:15px;
  color:#334155;
  transition:.2s;
}

.menu button:hover,
.menu button.active{
  background:#eaf3ff;
  color:#0756a8;
  font-weight:bold;
}

/* المحتوى */
.main{
  flex:1;
  padding:25px;
  max-width:1400px;
  margin:auto;
  width:100%;
}

/* الصفحة الرئيسية */
.hero{
  background:linear-gradient(135deg,#0756a8,#123f75);
  color:white;
  border-radius:20px;
  padding:35px;
  margin-bottom:25px;
  box-shadow:0 8px 25px rgba(7,86,168,.18);
}

.hero h1{
  font-size:30px;
  margin-bottom:12px;
}

.hero p{
  font-size:16px;
  line-height:1.8;
  opacity:.95;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.hero-btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  background:#ffffff;
  color:#0756a8;
}

.hero-btn.red{
  background:#c62828;
  color:white;
}

/* الإحصائيات */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  border-top:4px solid #0756a8;
}

.stat:nth-child(2){
  border-top-color:#c62828;
}

.stat:nth-child(3){
  border-top-color:#16823b;
}

.stat:nth-child(4){
  border-top-color:#b58a00;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-bottom:7px;
}

.stat-label{
  color:#687386;
  font-size:14px;
}

/* البطاقات */
.section{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.section-title h2{
  font-size:21px;
}

.section-title span{
  color:#0756a8;
  font-size:14px;
}

/* البحث */
.search-box{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:10px;
}

.search-box input,
.search-box select{
  width:100%;
  padding:13px;
  border:1px solid #d9e0e8;<!-- ============================= -->
<!-- المرحلة 2 : صفحات المنصة -->
<!-- ============================= -->

<div id="appPages" style="display:none;">

  <!-- صفحة البحث -->
  <section class="section page-box" id="searchPage">
    <div class="section-title">
      <h2>🔎 البحث عن خدمة</h2>
    </div>

    <div class="search-box">
      <input id="pageSearchInput" type="text" placeholder="اكتب اسم الخدمة">
      
      <select id="pageCategory">
        <option value="">كل الفئات</option>
        <option>تصميم</option>
        <option>كتابة</option>
        <option>ترجمة</option>
        <option>صيانة</option>
        <option>نقل</option>
        <option>تنظيف</option>
        <option>خدمات أخرى</option>
      </select>

      <select id="pageWilaya">
        <option value="">كل الولايات</option>
        <option>الجزائر</option>
        <option>بومرداس</option>
        <option>تيبازة</option>
        <option>البليدة</option>
        <option>وهران</option>
        <option>قسنطينة</option>
        <option>سطيف</option>
        <option>عنابة</option>
      </select>

      <button class="search-btn" onclick="searchServices()">
        بحث
      </button>
    </div>

    <div id="searchResults" style="margin-top:20px;"></div>
  </section>


  <!-- صفحة نشر خدمة -->
  <section class="section page-box" id="publishPage">

    <div class="section-title">
      <h2>➕ نشر خدمة جديدة</h2>
    </div>

    <div style="display:grid;gap:12px;">

      <input id="serviceTitle"
             type="text"
             placeholder="اسم الخدمة"
             style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">

      <select id="serviceCategory"
              style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">
        <option value="">اختر الفئة</option>
        <option>تصميم</option>
        <option>كتابة</option>
        <option>ترجمة</option>
        <option>صيانة</option>
        <option>نقل</option>
        <option>تنظيف</option>
        <option>خدمات أخرى</option>
      </select>

      <select id="serviceWilaya"
              style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">
        <option value="">اختر الولاية</option>
        <option>الجزائر</option>
        <option>بومرداس</option>
        <option>تيبازة</option>
        <option>البليدة</option>
        <option>وهران</option>
        <option>قسنطينة</option>
        <option>سطيف</option>
        <option>عنابة</option>
      </select>

      <input id="servicePrice"
             type="number"
             placeholder="السعر بالدينار الجزائري"
             style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">

      <textarea id="serviceDescription"
                placeholder="اكتب وصف الخدمة..."
                style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;min-height:130px;"></textarea>

      <button onclick="publishService()"
              style="border:0;background:#16823b;color:white;padding:14px;border-radius:10px;font-weight:bold;">
        نشر الخدمة
      </button>

    </div>

  </section>


  <!-- صفحة الطلبات -->
  <section class="section page-box" id="ordersPage">

    <div class="section-title">
      <h2>💼 طلباتي</h2>
    </div>

    <div id="ordersList">
      <p style="color:#687386;">
        لا توجد طلبات حالياً.
      </p>
    </div>

  </section>


  <!-- صفحة المفضلة -->
  <section class="section page-box" id="favoritesPage">

    <div class="section-title">
      <h2>❤️ المفضلة</h2>
    </div>

    <div id="favoritesList">
      <p style="color:#687386;">
        لا توجد خدمات مفضلة حالياً.
      </p>
    </div>

  </section>


  <!-- صفحة الإشعارات -->
  <section class="section page-box" id="notificationsPage">

    <div class="section-title">
      <h2>🔔 الإشعارات</h2>
    </div>

    <div id="notificationsList">
      <div style="padding:15px;background:#f4f7fb;border-radius:10px;">
        لا توجد إشعارات جديدة.
      </div>
    </div>

  </section>


  <!-- صفحة الحساب -->
  <section class="section page-box" id="accountPage">

    <div class="section-title">
      <h2>👤 حسابي</h2>
    </div>

    <div style="display:grid;gap:12px;">

      <input id="userName"
             type="text"
             placeholder="الاسم"
             style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">

      <input id="userPhone"
             type="tel"
             placeholder="رقم الهاتف"
             style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">

      <input id="userCity"
             type="text"
             placeholder="المدينة"
             style="padding:14px;border:1px solid #d9e0e8;border-radius:10px;">

      <button onclick="saveAccount()"
              style="border:0;background:#0756a8;color:white;padding:14px;border-radius:10px;font-weight:bold;">
        حفظ معلومات الحساب
      </button>

    </div>

  </section>


  <!-- صفحة الإعدادات -->
  <section class="section page-box" id="settingsPage">

    <div class="section-title">
      <h2>⚙️ الإعدادات</h2>
    </div>

    <div style="display:grid;gap:12px;">

      <button onclick="clearData()"
              style="border:0;background:#c62828;color:white;padding:14px;border-radius:10px;font-weight:bold;">
        🗑️ حذف بيانات المنصة من هذا الهاتف
      </button>

      <div style="padding:15px;background:#f4f7fb;border-radius:10px;">
        <strong>خدمات سيف الدين للعمل</strong>
        <p style="margin-top:6px;color:#687386;">
          منصة خدمات محلية في الجزائر.
        </p>
      </div>

    </div>

  </section>

</div>


<!-- تسجيل الدخول -->
<div id="loginModal"
     style="
     display:none;
     position:fixed;
     inset:0;
     background:rgba(0,0,0,.55);
     z-index:999;
     align-items:center;
     justify-content:center;
     padding:20px;
     ">

  <div style="
       background:white;
       width:100%;
       max-width:420px;
       border-radius:18px;
       padding:25px;
       box-shadow:0 15px 40px rgba(0,0,0,.2);
       ">

    <h2 style="margin-bottom:18px;">
      👤 تسجيل الدخول
    </h2>

    <input id="loginName"
           type="text"
           placeholder="اسمك"
           style="
           width:100%;
           padding:14px;
           border:1px solid #d9e0e8;
           border-radius:10px;
           margin-bottom:10px;
           ">

    <input id="loginPhone"
           type="tel"
           placeholder="رقم الهاتف"
           style="
           width:100%;
           padding:14px;
           border:1px solid #d9e0e8;
           border-radius:10px;
           margin-bottom:15px;
           ">

    <button onclick="loginUser()"
            style="
            width:100%;
            border:0;
            background:#0756a8;
            color:white;
            padding:14px;
            border-radius:10px;
            font-weight:bold;
            ">
      دخول
    </button>

    <button onclick="closeLogin()"
            style="
            width:100%;
            border:0;
            background:#eee;
            color:#333;
            padding:12px;
            border-radius:10px;
            margin-top:8px;
            ">
      إلغاء
    </button>

  </div>

</div>

<!-- نهاية المرحلة 2 --><!-- ============================= -->
<!-- المرحلة 3 : تشغيل المنصة -->
<!-- ============================= -->

<script>

let services = JSON.parse(localStorage.getItem("services")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let account = JSON.parse(localStorage.getItem("account")) || null;


/* فتح تسجيل الدخول */
function openLogin(){
  document.getElementById("loginModal").style.display = "flex";
}


/* إغلاق تسجيل الدخول */
function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}


/* تسجيل الدخول */
function loginUser(){

  const name = document.getElementById("loginName").value.trim();
  const phone = document.getElementById("loginPhone").value.trim();

  if(!name || !phone){
    alert("اكتب الاسم ورقم الهاتف");
    return;
  }

  account = {
    name:name,
    phone:phone,
    city:""
  };

  localStorage.setItem("account",JSON.stringify(account));

  document.getElementById("userName").value = name;
  document.getElementById("userPhone").value = phone;

  closeLogin();

  alert("تم تسجيل الدخول بنجاح ✅");

  showPage("accountPage");
}


/* حفظ الحساب */
function saveAccount(){

  const name = document.getElementById("userName").value.trim();
  const phone = document.getElementById("userPhone").value.trim();
  const city = document.getElementById("userCity").value.trim();

  if(!name || !phone){
    alert("اكتب الاسم ورقم الهاتف");
    return;
  }

  account = {
    name:name,
    phone:phone,
    city:city
  };

  localStorage.setItem("account",JSON.stringify(account));

  alert("تم حفظ معلومات الحساب ✅");
}


/* نشر خدمة */
function publishService(){

  const title =
    document.getElementById("serviceTitle").value.trim();

  const category =
    document.getElementById("serviceCategory").value;

  const wilaya =
    document.getElementById("serviceWilaya").value;

  const price =
    document.getElementById("servicePrice").value;

  const description =
    document.getElementById("serviceDescription").value.trim();


  if(!title || !category || !wilaya || !price || !description){

    alert("أكمل جميع معلومات الخدمة");

    return;
  }


  const service = {

    id:Date.now(),

    title:title,

    category:category,

    wilaya:wilaya,

    price:price,

    description:description,

    owner:account ? account.name : "مستخدم",

    date:new Date().toLocaleDateString("ar-DZ")

  };


  services.push(service);

  localStorage.setItem(
    "services",
    JSON.stringify(services)
  );


  document.getElementById("serviceTitle").value = "";
  document.getElementById("serviceCategory").value = "";
  document.getElementById("serviceWilaya").value = "";
  document.getElementById("servicePrice").value = "";
  document.getElementById("serviceDescription").value = "";


  updateStats();

  alert("تم نشر الخدمة بنجاح ✅");

  showPage("searchPage");

  displayServices(services);
}


/* عرض الخدمات */
function displayServices(list){

  const results =
    document.getElementById("searchResults");

  if(!list.length){

    results.innerHTML = `
      <div style="
      padding:20px;
      background:#f4f7fb;
      border-radius:12px;
      text-align:center;">
        لا توجد خدمات حالياً.
      </div>
    `;

    return;
  }


  results.innerHTML = list.map(service => `

    <div style="
      border:1px solid #e1e6ed;
      border-radius:15px;
      padding:18px;
      margin-bottom:12px;
      background:white;
    ">

      <div style="
        display:flex;
        justify-content:space-between;
        gap:10px;
        flex-wrap:wrap;
      ">

        <div>

          <h3 style="margin-bottom:8px;">
            ${service.title}
          </h3>

          <p style="color:#687386;">
            ${service.description}
          </p>

          <p style="margin-top:10px;">
            📂 ${service.category}
            &nbsp; | &nbsp;
            📍 ${service.wilaya}
          </p>

          <p style="
            margin-top:8px;
            color:#0756a8;
            font-weight:bold;
          ">
            💰 ${service.price} دج
          </p>

        </div>


        <div style="display:flex;gap:7px;align-items:flex-start;">

          <button
            onclick="addFavorite(${service.id})"
            style="
            border:0;
            background:#fff0f0;
            color:#c62828;
            padding:10px;
            border-radius:9px;
            ">
            ❤️
          </button>

          <button
            onclick="requestService(${service.id})"
            style="
            border:0;
            background:#0756a8;
            color:white;
            padding:10px 15px;
            border-radius:9px;
            font-weight:bold;
            ">
            طلب الخدمة
          </button>

        </div>

      </div>

    </div>

  `).join("");
}


/* البحث */
function searchServices(){

  const text =
    document.getElementById("pageSearchInput")
    .value
    .trim()
    .toLowerCase();

  const category =
    document.getElementById("pageCategory").value;

  const wilaya =
    document.getElementById("pageWilaya").value;


  const result = services.filter(service => {

    const matchText =
      !text ||
      service.title.toLowerCase().includes(text) ||
      service.description.toLowerCase().includes(text);

    const matchCategory =
      !category ||
      service.category === category;

    const matchWilaya =
      !wilaya ||
      service.wilaya === wilaya;

    return matchText &&
           matchCategory &&
           matchWilaya;

  });


  displayServices(result);
}


/* إضافة للمفضلة */
function addFavorite(id){

  const service =
    services.find(item => item.id === id);

  if(!service) return;


  if(!favorites.some(item => item.id === id)){

    favorites.push(service);

    localStorage.setItem(
      "favorites",
      JSON.stringify(favorites)
    );

    alert("تمت إضافة الخدمة للمفضلة ❤️");

  }else{

    alert("الخدمة موجودة في المفضلة");

  }

  displayFavorites();
}


/* عرض المفضلة */
function displayFavorites(){

  const box =
    document.getElementById("favoritesList");


  if(!favorites.length){

    box.innerHTML =
      `<p style="color:#687386;">
        لا توجد خدمات مفضلة حالياً.
      </p>`;

    return;
  }


  box.innerHTML = favorites.map(service => `

    <div style="
      border:1px solid #e1e6ed;
      border-radius:12px;
      padding:15px;
      margin-bottom:10px;
    ">

      <strong>${service.title}</strong>

      <p style="color:#687386;margin-top:6px;">
        ${service.wilaya} — ${service.price} دج
      </p>

    </div>

  `).join("");
}


/* طلب خدمة */
function requestService(id){

  const service =
    services.find(item => item.id === id);

  if(!service) return;


  const order = {

    id:Date.now(),

    serviceId:service.id,

    serviceTitle:service.title,

    price:service.price,

    date:new Date().toLocaleDateString("ar-DZ"),

    status:"جديد"

  };


  orders.push(order);

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );


  alert("تم إرسال طلب الخدمة ✅");

  displayOrders();

  showPage("ordersPage");
}


/* عرض الطلبات */
function displayOrders(){

  const box =
    document.getElementById("ordersList");


  if(!orders.length){

    box.innerHTML =
      `<p style="color:#687386;">
        لا توجد طلبات حالياً.
      </p>`;

    return;
  }


  box.innerHTML = orders.map(order => `

    <div style="
      border:1px solid #e1e6ed;
      border-radius:12px;
      padding:15px;
      margin-bottom:10px;
    ">

      <strong>${order.serviceTitle}</strong>

      <p style="margin-top:6px;">
        💰 ${order.price} دج
      </p>

      <p style="color:#16823b;margin-top:5px;">
        الحالة: ${order.status}
      </p>

      <small style="color:#687386;">
        ${order.date}
      </small>

    </div>

  `).join("");
}


/* التنقل بين الصفحات */
function showPage(pageId){

  document.querySelectorAll(".page-box")
    .forEach(page => {
      page.style.display = "none";
    });


  document.querySelectorAll(".menu button")
    .forEach(button => {
      button.classList.remove("active");
    });


  const page =
    document.getElementById(pageId);

  if(page){
    page.style.display = "block";
  }


  const appPages =
    document.getElementById("appPages");

  if(appPages){
    appPages.style.display = "block";
  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* الإحصائيات */
function updateStats(){

  document.querySelectorAll(".stat-number")[0]
    .textContent = services.length;

  document.querySelectorAll(".stat-number")[1]
    .textContent = orders.length;

  document.querySelectorAll(".stat-number")[2]
    .textContent = services.length;

}


/* حذف البيانات */
function clearData(){

  const ok =
    confirm("هل تريد حذف البيانات من هذا الهاتف؟");

  if(!ok) return;

  localStorage.removeItem("services");
  localStorage.removeItem("orders");
  localStorage.removeItem("favorites");
  localStorage.removeItem("account");

  services = [];
  orders = [];
  favorites = [];
  account = null;

  updateStats();

  displayServices([]);
  displayOrders();
  displayFavorites();

  alert("تم حذف البيانات");
}


/* تشغيل المنصة */
function initializeApp(){

  updateStats();

  displayServices(services);

  displayOrders();

  displayFavorites();


  if(account){

    document.getElementById("userName").value =
      account.name || "";

    document.getElementById("userPhone").value =
      account.phone || "";

    document.getElementById("userCity").value =
      account.city || "";

  }

}


/* أزرار القائمة */
document.querySelectorAll(".menu button")
.forEach((button,index) => {

  button.addEventListener("click",function(){

    if(index === 0){

      location.reload();

    }

    if(index === 1){

      showPage("searchPage");
      displayServices(services);

    }

    if(index === 2){

      showPage("publishPage");

    }

    if(index === 3){

      showPage("ordersPage");
      displayOrders();

    }

    if(index === 4){

      showPage("favoritesPage");
      displayFavorites();

    }

    if(index === 5){

      showPage("notificationsPage");

    }

    if(index === 6){

      showPage("accountPage");

    }

    if(index === 7){

      showPage("settingsPage");

    }

  });

});


/* زر الدخول في الأعلى */
document.querySelectorAll(".top-btn")[0]
.addEventListener("click",openLogin);


/* زر الحساب الجديد */
document.querySelectorAll(".top-btn")[1]
.addEventListener("click",openLogin);


/* أزرار الصفحة الرئيسية */
document.querySelectorAll(".hero-btn")[0]
.addEventListener("click",function(){

  showPage("searchPage");
  displayServices(services);

});


document.querySelectorAll(".hero-btn")[1]
.addEventListener("click",function(){

  showPage("publishPage");

});

initializeApp();
